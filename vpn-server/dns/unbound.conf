server:
    verbosity: 1
    interface: 0.0.0.0
    interface: ::0
    port: 5300
    ipv6-sockets: 1

    # Privacy: never log queries
    logfile: ""
    log-queries: no
    log-replies: no
    log-servfail: no

    # Security
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    use-caps-for-id: yes
    qname-minimisation: yes

    # Don't allow recursion from the internet — only VPN clients
    access-control: 10.66.0.0/24 allow
    access-control: fd86::/64 allow

    # Block DNS rebinding
    private-address: 10.0.0.0/8
    private-address: 100.64.0.0/10
    private-address: 127.0.0.0/8
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 192.0.0.0/16
    private-address: 192.0.2.0/24
    private-address: 192.88.99.0/24
    private-address: 192.168.0.0/16
    private-address: 198.18.0.0/15
    private-address: 198.51.100.0/24
    private-address: 203.0.113.0/24
    private-address: 240.0.0.0/4
    private-address: ::1/128
    private-address: FC00::/7
    private-address: FE80::/10

forward-zone:
    name: "."
    forward-first: yes
    # Indian upstream DNS-over-TLS resolvers
    forward-addr: 208.67.222.222@853#dnssense1.opendns.com
    forward-addr: 208.67.220.220@853#dnssense2.opendns.com
    forward-addr: 1.1.1.1@853#cloudflare
    forward-addr: 1.0.0.1@853#cloudflare
